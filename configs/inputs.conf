# Sample inputs.conf for the Splunk Universal Forwarder
# Location on the Windows host:
#   C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
#
# This tells the forwarder which Windows event logs to collect and which
# Splunk index to send them to. If the "endpoint" index does not exist on
# the Splunk server, none of these events will be received.
#
# NOTE: replace with your own values as needed — do not commit real
# credentials or internal hostnames if this repo is public.

[WinEventLog://Application]
disabled = 0
index = endpoint

[WinEventLog://Security]
disabled = 0
index = endpoint

[WinEventLog://System]
disabled = 0
index = endpoint

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = endpoint
renderXml = 1
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
